<style>
/* =========================================================
   GLOBAL
========================================================= */

.af-wrap,
.af-wrap * {
  box-sizing:border-box;
}

.af-wrap {
  max-width:900px;
  margin:25px auto;
  font-family:Arial, Helvetica, sans-serif;
  color:#eeeeee;
}

.af-wrap a {
  text-decoration:none;
}

/* =========================================================
   THEME NAVIGATION
========================================================= */

.af-nav {
  display:flex;
  flex-wrap:wrap;
  position:relative;
  z-index:10;
  margin-bottom:20px;
  overflow:hidden;
  background:#292929;
  border:1px solid #4a4a4a;
  border-radius:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.af-nav-link {
  position:relative;
  display:block;
  flex:1 1 200px;
  padding:18px;
  overflow:hidden;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  transition:
    flex .35s ease,
    transform .35s ease,
    filter .35s ease;
}

.af-nav-link:hover {
  flex-grow:1.18;
  transform:translateY(-3px);
  filter:brightness(1.12);
}

.af-nav-link::after {
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:55%;
  height:100%;
  pointer-events:none;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.28),
    transparent
  );
  transform:skewX(-20deg);
  transition:left .6s ease;
}

.af-nav-link:hover::after {
  left:150%;
}

.af-nav-comedy {
  color:#342018;
  background:#ff7b3f;
}

.af-nav-mystery {
  color:#ffffff;
  background:#e33e4c;
}

.af-nav-tragedy {
  color:#ffffff;
  background:#469b98;
}

/* =========================================================
   SHARED SECTION RULES
========================================================= */

.af-section {
  margin-bottom:35px;
  overflow:hidden;
}

.af-card {
  transition:
    transform .3s ease,
    box-shadow .3s ease,
    filter .3s ease;
}

.af-card:hover {
  transform:translateY(-7px);
}

.af-button {
  display:inline-block;
  transition:
    transform .22s ease,
    filter .22s ease,
    box-shadow .22s ease;
}

.af-button:hover {
  transform:translateY(-4px) scale(1.04);
  filter:brightness(1.12);
}

.af-button:active {
  transform:translateY(0) scale(.96);
}

/* =========================================================
   COMEDY ANIMATIONS
========================================================= */

@keyframes comedy-pop {
  0%, 76%, 100% {
    transform:scale(1) rotate(0deg);
  }

  83% {
    transform:scale(1.08) rotate(-2deg);
  }

  91% {
    transform:scale(.97) rotate(1deg);
  }
}

@keyframes comedy-star-left {
  0%, 100% {
    transform:rotate(-15deg) scale(1);
    opacity:.65;
  }

  50% {
    transform:rotate(18deg) scale(1.35);
    opacity:1;
  }
}

@keyframes comedy-star-right {
  0%, 100% {
    transform:rotate(18deg) scale(1);
    opacity:.65;
  }

  50% {
    transform:rotate(-15deg) scale(1.3);
    opacity:1;
  }
}

@keyframes comedy-ticket {
  0%, 100% {
    letter-spacing:4px;
  }

  50% {
    letter-spacing:5px;
  }
}

@keyframes comedy-confetti-one {
  0% {
    transform:translateY(-50px) rotate(0deg);
    opacity:0;
  }

  15% {
    opacity:1;
  }

  100% {
    transform:translateY(410px) rotate(300deg);
    opacity:0;
  }
}

@keyframes comedy-confetti-two {
  0% {
    transform:translateY(-70px) rotate(0deg);
    opacity:0;
  }

  15% {
    opacity:.9;
  }

  100% {
    transform:translateY(430px) rotate(-260deg);
    opacity:0;
  }
}

.comedy-title {
  display:inline-block;
  animation:comedy-pop 3.7s ease-in-out infinite;
}

.comedy-star-left {
  animation:comedy-star-left 1.8s ease-in-out infinite;
}

.comedy-star-right {
  animation:comedy-star-right 2.1s ease-in-out infinite;
}

.comedy-ticket {
  animation:comedy-ticket 2.5s ease-in-out infinite;
}

.comedy-confetti {
  position:absolute;
  top:-30px;
  z-index:1;
  pointer-events:none;
  font-size:18px;
  font-weight:bold;
}

.comedy-confetti-a {
  left:10%;
  color:#ffe35a;
  animation:comedy-confetti-one 6s linear infinite;
}

.comedy-confetti-b {
  left:28%;
  color:#ffffff;
  animation:comedy-confetti-two 7s linear 1.5s infinite;
}

.comedy-confetti-c {
  left:51%;
  color:#e33e4c;
  animation:comedy-confetti-one 6.8s linear 3s infinite;
}

.comedy-confetti-d {
  left:73%;
  color:#469b98;
  animation:comedy-confetti-two 7.4s linear .7s infinite;
}

.comedy-confetti-e {
  left:90%;
  color:#ffe35a;
  animation:comedy-confetti-one 6.3s linear 2.2s infinite;
}

/* =========================================================
   MYSTERY ANIMATIONS
========================================================= */

@keyframes mystery-flicker {
  0%, 18%, 22%, 25%, 53%, 57%, 100% {
    opacity:1;
    text-shadow:
      2px 2px 0 #295d5b,
      0 0 16px rgba(78,170,166,.55);
  }

  20%, 24%, 55% {
    opacity:.48;
    text-shadow:none;
  }
}

@keyframes mystery-scan {
  0% {
    transform:translateX(-160%) skewX(-18deg);
  }

  100% {
    transform:translateX(950%) skewX(-18deg);
  }
}

@keyframes mystery-fog-left {
  0%, 100% {
    transform:translateX(-4%) translateY(0);
    opacity:.17;
  }

  50% {
    transform:translateX(5%) translateY(-7px);
    opacity:.35;
  }
}

@keyframes mystery-fog-right {
  0%, 100% {
    transform:translateX(5%) translateY(-3px);
    opacity:.12;
  }

  50% {
    transform:translateX(-6%) translateY(5px);
    opacity:.3;
  }
}

@keyframes mystery-report-pulse {
  0%, 100% {
    box-shadow:
      7px 7px 0 #080d0e,
      0 0 0 rgba(78,170,166,0);
  }

  50% {
    box-shadow:
      7px 7px 0 #080d0e,
      0 0 24px rgba(78,170,166,.28);
  }
}

.mystery-title {
  display:inline-block;
  animation:mystery-flicker 5.5s linear infinite;
}

.mystery-header::after {
  content:"";
  position:absolute;
  top:-20%;
  left:0;
  width:85px;
  height:140%;
  pointer-events:none;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(192,255,251,.18),
    transparent
  );
  animation:mystery-scan 6s linear infinite;
}

.mystery-fog-one,
.mystery-fog-two {
  position:absolute;
  left:-10%;
  width:120%;
  pointer-events:none;
  border-radius:50%;
}

.mystery-fog-one {
  bottom:-55px;
  height:125px;
  background:radial-gradient(
    ellipse at center,
    rgba(141,219,214,.18),
    transparent 67%
  );
  animation:mystery-fog-left 8s ease-in-out infinite;
}

.mystery-fog-two {
  bottom:-20px;
  height:80px;
  background:radial-gradient(
    ellipse at center,
    rgba(206,242,240,.11),
    transparent 70%
  );
  animation:mystery-fog-right 10s ease-in-out infinite;
}

.mystery-report {
  animation:mystery-report-pulse 4.5s ease-in-out infinite;
}

.mystery-card {
  position:relative;
  overflow:hidden;
}

.mystery-card::after {
  content:"CLASSIFIED";
  position:absolute;
  right:-48px;
  bottom:22px;
  padding:5px 50px;
  pointer-events:none;
  font-size:8px;
  font-weight:bold;
  letter-spacing:3px;
  color:rgba(145,220,216,.17);
  border:1px solid rgba(145,220,216,.17);
  transform:rotate(-35deg);
}

.mystery-card:hover {
  filter:brightness(1.12);
  box-shadow:0 13px 25px rgba(0,0,0,.4);
}

/* =========================================================
   TRAGEDY ANIMATIONS
========================================================= */

@keyframes tragedy-curtain-left {
  0% {
    transform:translateX(-95%);
  }

  100% {
    transform:translateX(0);
  }
}

@keyframes tragedy-curtain-right {
  0% {
    transform:translateX(95%);
  }

  100% {
    transform:translateX(0);
  }
}

@keyframes tragedy-breathe {
  0%, 100% {
    transform:scale(1);
    text-shadow:
      3px 3px 0 #280a14,
      0 0 10px rgba(224,167,178,.17);
  }

  50% {
    transform:scale(1.025);
    text-shadow:
      3px 3px 0 #280a14,
      0 0 27px rgba(224,167,178,.44);
  }
}

@keyframes tragedy-fall {
  0% {
    transform:translateY(-35px) rotate(0deg);
    opacity:0;
  }

  15% {
    opacity:.85;
  }

  100% {
    transform:translateY(450px) rotate(260deg);
    opacity:0;
  }
}

@keyframes tragedy-quote {
  0%, 100% {
    opacity:.72;
  }

  50% {
    opacity:1;
  }
}

.tragedy-curtain-left,
.tragedy-curtain-right {
  position:absolute;
  top:0;
  bottom:0;
  width:25%;
  z-index:1;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      90deg,
      #451326 0,
      #731f3c 24px,
      #35101e 48px
    );
}

.tragedy-curtain-left {
  left:0;
  clip-path:polygon(0 0, 100% 0, 73% 100%, 0 100%);
  animation:tragedy-curtain-left 1.5s ease-out both;
}

.tragedy-curtain-right {
  right:0;
  clip-path:polygon(0 0, 100% 0, 100% 100%, 27% 100%);
  animation:tragedy-curtain-right 1.5s ease-out both;
}

.tragedy-header-content {
  position:relative;
  z-index:2;
}

.tragedy-title {
  display:inline-block;
  animation:tragedy-breathe 4.8s ease-in-out infinite;
}

.tragedy-petal {
  position:absolute;
  top:-30px;
  z-index:3;
  pointer-events:none;
  color:#be6680;
  animation:tragedy-fall 7s linear infinite;
}

.tragedy-petal-a {
  left:10%;
  animation-delay:0s;
}

.tragedy-petal-b {
  left:27%;
  animation-delay:2s;
  animation-duration:8.5s;
}

.tragedy-petal-c {
  left:48%;
  animation-delay:4s;
  animation-duration:7.5s;
}

.tragedy-petal-d {
  left:70%;
  animation-delay:1s;
  animation-duration:9s;
}

.tragedy-petal-e {
  left:89%;
  animation-delay:3.2s;
  animation-duration:6.8s;
}

.tragedy-quote {
  animation:tragedy-quote 4s ease-in-out infinite;
}

.tragedy-card:hover {
  box-shadow:
    0 14px 27px rgba(0,0,0,.4),
    inset 0 0 22px rgba(197,150,81,.1);
}

/* =========================================================
   ACCESSIBILITY
========================================================= */

@media (prefers-reduced-motion: reduce) {
  .af-wrap *,
  .af-wrap *::before,
  .af-wrap *::after {
    animation:none !important;
    transition:none !important;
  }
}
</style>

<div class="af-wrap">

  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <div class="af-nav">

    <a class="af-nav-link af-nav-comedy" href="#comedy">
      Comedy
    </a>

    <a class="af-nav-link af-nav-mystery" href="#mystery">
      Mystery
    </a>

    <a class="af-nav-link af-nav-tragedy" href="#tragedy">
      Tragedy
    </a>

  </div>
